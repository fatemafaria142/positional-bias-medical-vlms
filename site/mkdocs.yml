site_name: RQ Explorer
site_description: Seven research questions on how VoxTell handles left and right on brain MRI
docs_dir: docs
site_dir: _site
use_directory_urls: false

theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: white
    accent: red
  features:
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.suggest

nav:
  - Home: index.md
  - RQ1: rq1.md
  - RQ2: rq2.md
  - RQ3: rq3.md
  - RQ4: rq4.md
  - RQ5: rq5.md
  - RQ6: rq6.md
  - RQ7: rq7.md
  - Methodology: methodology.md
  - Master analysis: master.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: false

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/figures.js
